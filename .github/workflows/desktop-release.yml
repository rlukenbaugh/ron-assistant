name: Desktop Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag and package version differ.' }
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:hermes
      - run: npm run test:e2e
      - name: Package Windows applications
        shell: pwsh
        run: |
          if ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD) {
            npx electron-builder --win nsis portable --x64 --publish never -c.win.signExecutable=true
          } else {
            npm run dist:win
          }
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $env:RON_PACKAGED_TEST='1'
          npm run test:e2e
      - name: Prepare release notes and hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work -Force | Out-Null
          npm run release:notes
          Get-ChildItem release -Filter *.exe | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - name: Publish checked artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version=(Get-Content package.json | ConvertFrom-Json).version
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "v$version" --repo $env:GITHUB_REPOSITORY --title "Ron Assistant v$version" --notes-file work/release-notes.md }
          gh release upload "v$version" "release/Ron-Assistant-Setup-$version-x64.exe" "release/Ron-Assistant-Portable-$version-x64.exe" release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-evidence
          path: |
            test-results
            work/*.png
          if-no-files-found: ignore
